version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        patterns:
          - "*"
    labels:
      - dependencies
      - web
    commit-message:
      prefix: "chore(deps)"
